services:
  lb:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      api-3:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 192M
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api-1:
    image: aninhadev/500mb-api:latest
    user: "app"
    environment:
      - REDIS_ADDR=redis:6379
      - LISTEN_ADDR=:8000
      - INSTANCE_ID=api-1
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 92M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  api-2:
    image: aninhadev/500mb-api:latest
    user: "app"
    environment:
      - REDIS_ADDR=redis:6379
      - LISTEN_ADDR=:8000
      - INSTANCE_ID=api-2
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 92M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  api-3:
    image: aninhadev/500mb-api:latest
    user: "app"
    environment:
      - REDIS_ADDR=redis:6379
      - LISTEN_ADDR=:8000
      - INSTANCE_ID=api-3
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 92M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped